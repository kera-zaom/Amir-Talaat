<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة | الخورزمي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#0d0f14;
    --card:rgba(255,255,255,.075);
    --card2:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.10);
    --text:#f7f7fa;
    --muted:#9da2ad;
    --accent:#b8bce8;
    --accent2:#777da6;
    --danger:#ff7f88;
}

body{
    min-height:100vh;
    color:var(--text);

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

    background:
    radial-gradient(
        circle at 50% -10%,
        rgba(132,140,180,.40),
        transparent 38%
    ),
    radial-gradient(
        circle at 100% 50%,
        rgba(90,95,130,.18),
        transparent 35%
    ),
    var(--bg);

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:280px;
    height:280px;

    left:-130px;
    bottom:-100px;

    border-radius:50%;

    background:rgba(160,165,210,.10);

    filter:blur(60px);

    pointer-events:none;
}

.app{
    width:min(1100px,94%);
    margin:auto;
    padding:24px 0 60px;
}


/* ================= HEADER ================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    margin-bottom:25px;

    animation:fadeDown .7s ease both;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-icon{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.17),
        rgba(255,255,255,.035)
    );

    border:1px solid var(--line);

    box-shadow:
    inset 0 1px rgba(255,255,255,.15),
    0 15px 35px rgba(0,0,0,.25);

    font-size:23px;
}

.brand h1{
    font-size:19px;
    letter-spacing:-.4px;
}

.brand p{
    color:var(--muted);
    font-size:10px;
    margin-top:4px;
}

.logout{
    border:1px solid rgba(255,255,255,.10);

    background:rgba(255,255,255,.055);

    color:#fff;

    padding:11px 16px;

    border-radius:14px;

    cursor:pointer;

    font-family:inherit;

    transition:.25s;
}

.logout:hover{
    background:rgba(255,100,110,.12);
    border-color:rgba(255,100,110,.25);
}


/* ================= STATS ================= */

.stats{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

    margin-bottom:20px;
}

.stat{
    padding:18px;

    border-radius:22px;

    background:var(--card);

    border:1px solid var(--line);

    backdrop-filter:blur(20px);

    box-shadow:
    0 18px 45px rgba(0,0,0,.18);

    animation:rise .7s ease both;
}

.stat:nth-child(2){
    animation-delay:.08s;
}

.stat:nth-child(3){
    animation-delay:.16s;
}

.stat-icon{
    font-size:20px;
    margin-bottom:12px;
}

.stat-number{
    font-size:25px;
    font-weight:800;
}

.stat-label{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}


/* ================= TABS ================= */

.tabs{
    display:flex;

    gap:8px;

    padding:7px;

    margin-bottom:18px;

    overflow-x:auto;

    border-radius:20px;

    background:rgba(255,255,255,.045);

    border:1px solid var(--line);

    backdrop-filter:blur(18px);
}

.tab{
    flex:1;

    min-width:100px;

    padding:13px 10px;

    border:0;
    border-radius:14px;

    color:var(--muted);

    background:transparent;

    font-family:inherit;

    cursor:pointer;

    transition:.25s;
}

.tab.active{
    color:#fff;

    background:
    linear-gradient(
        135deg,
        rgba(190,195,235,.25),
        rgba(110,115,155,.12)
    );

    box-shadow:
    inset 0 1px rgba(255,255,255,.10);
}


/* ================= PANEL ================= */

.panel{
    display:none;

    animation:panelIn .45s ease both;
}

.panel.active{
    display:block;
}

.form-card{
    padding:25px;

    border-radius:27px;

    background:var(--card);

    border:1px solid var(--line);

    backdrop-filter:blur(22px);

    box-shadow:
    0 25px 70px rgba(0,0,0,.25);
}

.form-head{
    margin-bottom:22px;
}

.form-head h2{
    font-size:19px;
}

.form-head p{
    color:var(--muted);
    font-size:11px;
    margin-top:6px;
}


/* ================= INPUTS ================= */

.form-grid{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;
}

.full{
    grid-column:1/-1;
}

.field label{
    display:block;

    color:#c8cbd4;

    font-size:11px;

    margin:0 5px 7px;
}

input,
textarea,
select{
    width:100%;

    border:1px solid rgba(255,255,255,.08);

    border-radius:16px;

    padding:14px 15px;

    color:white;

    background:rgba(0,0,0,.20);

    outline:none;

    font-family:inherit;

    transition:.25s;
}

input::placeholder,
textarea::placeholder{
    color:#666b75;
}

input:focus,
textarea:focus,
select:focus{
    border-color:rgba(190,195,240,.45);

    background:rgba(0,0,0,.27);

    box-shadow:
    0 0 0 3px rgba(180,185,230,.05);
}

textarea{
    min-height:105px;
    resize:vertical;
}

select option{
    color:#111;
}


/* ================= BUTTON ================= */

.save{
    width:100%;

    margin-top:17px;

    border:1px solid rgba(255,255,255,.14);

    border-radius:17px;

    padding:15px;

    color:white;

    font-family:inherit;

    font-weight:800;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #747b9d,
        #3b3f4e
    );

    box-shadow:
    0 15px 30px rgba(0,0,0,.25);

    transition:.25s;
}

.save:hover{
    transform:translateY(-2px);

    box-shadow:
    0 20px 40px rgba(0,0,0,.35);
}

.save:active{
    transform:scale(.98);
}

.message{
    min-height:18px;

    text-align:center;

    margin-top:11px;

    color:#aeb3ff;

    font-size:11px;
}


/* ================= LOADING ================= */

.loading{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(5,6,9,.65);

    backdrop-filter:blur(10px);

    z-index:100;
}

.loading.show{
    display:flex;
}

.loader{
    width:40px;
    height:40px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.12);

    border-top-color:#d1d4ff;

    animation:spin .8s linear infinite;
}


/* ================= TOAST ================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
    translate(-50%,30px);

    opacity:0;

    padding:13px 18px;

    border-radius:15px;

    background:rgba(35,38,48,.9);

    border:1px solid var(--line);

    backdrop-filter:blur(18px);

    font-size:12px;

    pointer-events:none;

    transition:.35s;

    z-index:200;
}

.toast.show{
    opacity:1;

    transform:
    translate(-50%,0);
}


/* ================= ANIMATIONS ================= */

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes rise{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes panelIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* ================= MOBILE ================= */

@media(max-width:650px){

    .app{
        width:92%;
        padding-top:17px;
    }

    .header{
        align-items:flex-start;
    }

    .brand h1{
        font-size:17px;
    }

    .logout{
        padding:9px 12px;
        font-size:11px;
    }

    .stats{
        gap:8px;
    }

    .stat{
        padding:14px 11px;
        border-radius:18px;
    }

    .stat-icon{
        font-size:17px;
        margin-bottom:8px;
    }

    .stat-number{
        font-size:20px;
    }

    .stat-label{
        font-size:9px;
    }

    .form-card{
        padding:18px;
        border-radius:23px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .tab{
        min-width:92px;
        font-size:11px;
    }
}
</style>
</head>


<body>

            </div>

                        <option>أولى إعدادي</option>

<div

<div
    id="toast"

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://mxhtmolljnjfqhxcgjff.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_bzaMkNmdzkYRqbPZHIov6A_pPfVyW4n";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================
   TAB SYSTEM
========================================= */

function openTab(id,button){

    document
    .querySelectorAll(".panel")
    .forEach(panel=>{
        panel.classList.remove("active");
    });

    document
    .querySelectorAll(".tab")
    .forEach(tab=>{
        tab.classList.remove("active");
    });

    document
    .getElementById(id)
    .classList.add("active");

    button.classList.add("active");
}


/* =========================================
   LOADING
========================================= */

function loading(show){

    document
    .getElementById("loading")
    .classList.toggle(
        "show",
        show
    );
}


/* =========================================
   TOAST
========================================= */

function toast(text){

    const el =
        document.getElementById("toast");

    el.textContent = text;

    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },2500);
}


/* =========================================
   ADMIN CHECK
========================================= */

async function checkAdmin(){

    const {
        data:{user}
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        window.location.href =
        "admin-login.html";

        return false;
    }


    const {data,error} =
    await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id",user.id)
    .single();


    if(
        error ||
        !data ||
        data.role !== "admin"
    ){

        await supabaseClient.auth.signOut();

        window.location.href =
        "admin-login.html";

        return false;
    }

    return true;
}


/* =========================================
   ADD COURSE
========================================= */

async function addCourse(){

    const title =
    document
    .getElementById("courseTitle")
    .value.trim();


    const description =
    document
    .getElementById("courseDescription")
    .value.trim();


    const grade =
    document
    .getElementById("courseGrade")
    .value;


    const image =
    document
    .getElementById("courseImage")
    .value.trim();


    const message =
    document
    .getElementById("courseMessage");


    if(!title || !grade){

        message.textContent =
        "اكتب اسم الكورس واختر السنة.";

        return;
    }


    loading(true);


    const {error} =
    await supabaseClient
    .from("courses")
    .insert({

        title:title,
        description:description,
        grade:grade,
        image_url:image || null

    });


    loading(false);


    if(error){

        console.error(error);

        message.textContent =
        "حدث خطأ أثناء الإضافة.";

        return;
    }


    message.textContent =
    "تمت إضافة الكورس بنجاح ✓";

    toast("تمت إضافة الكورس ✨");


    document
    .getElementById("courseTitle")
    .value="";


    document
    .getElementById("courseDescription")
    .value="";


    document
    .getElementById("courseImage")
    .value="";


    document
    .getElementById("courseGrade")
    .value="";


    loadStats();
}


/* =========================================
   ADD VIDEO
========================================= */

async function addVideo(){

    const title =
    document
    .getElementById("videoTitle")
    .value.trim();


    const description =
    document
    .getElementById("videoDescription")
    .value.trim();


    const videoUrl =
    document
    .getElementById("videoUrl")
    .value.trim();


    const thumbnail =
    document
    .getElementById("thumbnailUrl")
    .value.trim();


    const grade =
    document
    .getElementById("videoGrade")
    .value;


    const message =
    document
    .getElementById("videoMessage");


    if(!title || !videoUrl || !grade){

        message.textContent =
        "أكمل البيانات المطلوبة.";

        return;
    }


    loading(true);


    const {error} =
    await supabaseClient
    .from("videos")
    .insert({

        title:title,
        description:description,
        video_url:videoUrl,
        thumbnail_url:thumbnail || null,
        grade:grade

    });


    loading(false);


    if(error){

        console.error(error);

        message.textContent =
        "حدث خطأ أثناء الإضافة.";

        return;
    }


    message.textContent =
    "تمت إضافة الفيديو بنجاح ✓";

    toast("تمت إضافة الفيديو 🎬");


    document
    .getElementById("videoTitle")
    .value="";


    document
    .getElementById("videoDescription")
    .value="";


    document
    .getElementById("videoUrl")
    .value="";


    document
    .getElementById("thumbnailUrl")
    .value="";


    document
    .getElementById("videoGrade")
    .value="";


    loadStats();
}


/* =========================================
   ADD EXAM
========================================= */

async function addExam(){

    const title =
    document
    .getElementById("examTitle")
    .value.trim();


    const description =
    document
    .getElementById("examDescription")
    .value.trim();


    const grade =
    document
    .getElementById("examGrade")
    .value;


    const duration =
    Number(
        document
        .getElementById("examDuration")
        .value
    ) || 30;


    const message =
    document
    .getElementById("examMessage");


    if(!title || !grade){

        message.textContent =
        "اكتب اسم الاختبار واختر السنة.";

        return;
    }


    loading(true);


    const {error} =
    await supabaseClient
    .from("exams")
    .insert({

        title:title,
        description:description,
        grade:grade,
        duration_minutes:duration

    });


    loading(false);


    if(error){

        console.error(error);

        message.textContent =
        "حدث خطأ أثناء الإضافة.";

        return;
    }


    message.textContent =
    "تم إنشاء الاختبار بنجاح ✓";

    toast("تم إنشاء الاختبار 📝");


    document
    .getElementById("examTitle")
    .value="";


    document
    .getElementById("examDescription")
    .value="";


    document
    .getElementById("examGrade")
    .value="";


    document
    .getElementById("examDuration")
    .value="30";


    loadStats();
}


/* =========================================
   STATISTICS
========================================= */

async function loadStats(){

    const tables = [
        ["courses","coursesCount"],
        ["videos","videosCount"],
        ["exams","examsCount"]
    ];


    for(const [table,id] of tables){

        const {count,error} =
        await supabaseClient
        .from(table)
        .select("*",{
            count:"exact",
            head:true
        });


        if(!error){

            document
            .getElementById(id)
            .textContent =
            count ?? 0;
        }
    }
}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
    "admin-login.html";
}


/* =========================================
   START
========================================= */

(async()=>{

    const ok =
    await checkAdmin();

    if(ok){

        loadStats();

    }

})();
