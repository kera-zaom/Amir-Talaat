<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>𝑨𝒍𝑲𝒉𝒘𝒂𝒓𝒊𝒛𝒎𝒊</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased;
    background:#080808;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 38%,
            rgba(80,80,80,.35) 0%,
            rgba(35,35,35,.22) 28%,
            rgba(10,10,10,.92) 70%,
            #050505 100%
        );

    z-index:-10;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    opacity:.045;

    background-image:
        radial-gradient(
            rgba(255,255,255,.8) 1px,
            transparent 1px
        );

    background-size:58px 58px;
    z-index:-9;
    pointer-events:none;
}


/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            #262626 0%,
            #111 42%,
            #050505 100%
        );

    z-index:100;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#intro.hide{
    opacity:0;
    transform:scale(1.08);
    pointer-events:none;
}

.introContent{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}


/* =========================
   3D LOGO
========================= */

.logo3D{
    position:relative;
    width:175px;
    height:175px;
    perspective:900px;
    margin-top:-35px;
}

.ring{
    position:absolute;

    width:165px;
    height:55px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotateX(65deg);

    border:
        1px solid
        rgba(255,255,255,.35);

    border-radius:50%;

    box-shadow:
        0 0 15px
        rgba(255,255,255,.04);

    animation:
        ringSpin
        6s
        linear
        infinite;
}

.ring:nth-child(2){
    transform:
        translate(-50%,-50%)
        rotateX(65deg)
        rotateZ(60deg);

    animation-duration:8s;
}

.ring:nth-child(3){
    transform:
        translate(-50%,-50%)
        rotateX(65deg)
        rotateZ(120deg);

    animation-duration:10s;
}

@keyframes ringSpin{
    from{
        rotate:0deg;
    }

    to{
        rotate:360deg;
    }
}

.core{
    position:absolute;

    width:82px;
    height:82px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            #414141,
            #080808
        );

    border:
        1px solid
        #666;

    box-shadow:
        0 0 35px
        rgba(255,255,255,.12),

        inset 0 1px
        rgba(255,255,255,.12);

    animation:
        coreSpin
        7s
        linear
        infinite;
}

.core::before{
    content:"</>";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    direction:ltr;

    color:#ddd;

    font-family:monospace;

    font-size:27px;
    font-weight:bold;
}

@keyframes coreSpin{

    from{
        transform:
            translate(-50%,-50%)
            rotateX(0deg)
            rotateY(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotateX(360deg)
            rotateY(360deg);
    }
}


/* =========================
   WELCOME
========================= */

.welcome{
    margin-top:-5px;
    opacity:0;

    animation:
        welcomeIn
        1.2s
        ease
        .4s
        forwards;
}

@keyframes welcomeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.welcome h1{
    font-size:28px;
    line-height:1.5;
    font-weight:700;
}

.welcome h1 span{
    display:block;
    direction:ltr;

    margin-top:3px;

    font-family:Georgia,serif;

    font-size:31px;
    font-style:italic;

    letter-spacing:2px;

    color:#ddd;
}

.line{
    width:150px;
    height:1px;

    margin:13px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #aaa,
            transparent
        );
}

.welcome small{
    direction:ltr;
    color:#666;

    font-size:9px;
    letter-spacing:4px;
}


/* =========================
   MAIN
========================= */

#main{
    position:fixed;
    inset:0;

    opacity:0;
    visibility:hidden;

    transition:
        opacity .8s ease;

    z-index:20;
}

#main.show{
    opacity:1;
    visibility:visible;
}


/* =========================
   QUESTION
========================= */

.questionBox{
    position:absolute;

    left:50%;
    top:50%;

    width:94%;
    max-width:410px;

    transform:
        translate(-50%,-50%);

    text-align:center;

    transition:
        opacity .65s ease,
        transform .7s
        cubic-bezier(.2,.8,.2,1);
}

.questionBox.hide{
    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(.55);

    pointer-events:none;
}

.questionTitle{
    color:#888;
    font-size:12px;
    margin-bottom:13px;
}

.question{
    font-size:24px;
    font-weight:700;
    line-height:1.6;
    margin-bottom:26px;

    text-shadow:
        0 0 25px
        rgba(255,255,255,.12);
}


/* =========================
   ANSWERS
========================= */

.answers{
    display:flex;
    justify-content:center;
    align-items:center;

    gap:9px;
    flex-wrap:wrap;
}

.answer{
    position:relative;

    min-width:91px;
    height:45px;

    padding:0 13px;

    border:
        1px solid
        rgba(255,255,255,.22);

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    color:#fff;

    font-family:inherit;
    font-size:12px;
    font-weight:600;

    cursor:pointer;

    transition:
        transform .4s
        cubic-bezier(.2,.8,.2,1),

        opacity .4s,

        box-shadow .4s;
}

.answer:active{
    transform:scale(.94);
}

#yes.big{
    transform:scale(1.6);

    box-shadow:
        0 0 25px
        rgba(255,255,255,.45),

        0 0 70px
        rgba(255,255,255,.2);

    animation:
        yesPulse
        .4s
        ease
        infinite
        alternate;
}

@keyframes yesPulse{

    from{
        filter:brightness(1);
    }

    to{
        filter:brightness(1.8);
    }
}

#afraid.running{
    animation:
        scaredRun
        .55s
        infinite
        alternate
        ease-in-out;
}

@keyframes scaredRun{

    0%{
        transform:
            translate(-35px,8px)
            rotate(-5deg);
    }

    25%{
        transform:
            translate(48px,-12px)
            rotate(7deg);
    }

    50%{
        transform:
            translate(-55px,-4px)
            rotate(-8deg);
    }

    75%{
        transform:
            translate(40px,15px)
            rotate(6deg);
    }

    100%{
        transform:
            translate(-20px,-10px)
            rotate(-4deg);
    }
}

#maybe.running{
    animation:
        confusedRun
        .7s
        infinite
        alternate
        ease-in-out;
}

@keyframes confusedRun{

    0%{
        transform:
            translate(28px,0)
            rotate(3deg);
    }

    50%{
        transform:
            translate(-32px,-8px)
            rotate(-5deg);
    }

    100%{
        transform:
            translate(24px,7px)
            rotate(4deg);
    }
}

.answer.disappear{
    opacity:0;

    transform:
        scale(.05);

    pointer-events:none;
}


/* =========================
   EFFECTS
========================= */

#flash{
    position:fixed;
    inset:0;

    background:#fff;

    opacity:0;
    pointer-events:none;

    z-index:180;
}

#flash.active{
    animation:
        screenFlash
        .5s
        ease-out
        forwards;
}

@keyframes screenFlash{

    0%{
        opacity:0;
    }

    18%{
        opacity:.8;
    }

    100%{
        opacity:0;
    }
}

.explosionRing{
    position:fixed;

    left:50%;
    top:50%;

    width:30px;
    height:30px;

    border:
        2px solid
        rgba(255,255,255,.9);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        scale(.1);

    opacity:0;

    pointer-events:none;

    z-index:170;
}

.explosionRing.active{
    animation:
        ringExplosion
        .9s
        cubic-bezier(.1,.7,.2,1)
        forwards;
}

@keyframes ringExplosion{

    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(15);
    }
}

.particle{
    position:fixed;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#fff;

    opacity:0;

    pointer-events:none;

    z-index:175;

    animation:
        particleFly
        1s
        cubic-bezier(.1,.7,.2,1)
        forwards;
}

@keyframes particleFly{

    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    100%{
        opacity:0;

        transform:
            translate(var(--px),var(--py))
            scale(0);
    }
}

#emojiLayer{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:160;
}

.boomEmoji{
    position:absolute;

    left:50%;
    top:50%;

    font-size:28px;

    opacity:0;

    animation:
        boom
        1.9s
        cubic-bezier(.12,.75,.2,1)
        forwards;
}

@keyframes boom{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.1)
            rotate(0deg);
    }

    10%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.3)
            rotate(var(--r));
    }
}


/* =========================
   PANELS
========================= */

.panel{
    position:absolute;

    left:50%;
    top:50%;

    width:min(340px,88vw);

    max-height:88vh;

    overflow-y:auto;

    padding:25px 19px;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:0;
    visibility:hidden;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(38,38,38,.98),
            rgba(7,7,7,.99)
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.9),

        inset
        0 1px
        rgba(255,255,255,.08);

    transition:
        opacity .7s,
        transform .8s
        cubic-bezier(.16,.8,.2,1);

    z-index:60;
}

.panel.show{
    opacity:1;
    visibility:visible;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.panel::-webkit-scrollbar{
    width:3px;
}

.panel::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:10px;
}

.loginLogo{
    text-align:center;

    direction:ltr;

    color:#777;

    font-family:monospace;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:9px;
}

.panel h2{
    text-align:center;

    font-size:24px;
    font-weight:700;

    margin-bottom:6px;
}

.panelSub{
    text-align:center;

    color:#666;

    font-size:10px;

    margin-bottom:17px;
}


/* =========================
   INPUTS
========================= */

.field{
    margin-bottom:10px;
}

.field input,
.field select{

    width:100%;

    height:45px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:#070707;

    outline:none;

    color:#fff;

    padding:0 13px;

    font-family:inherit;

    font-size:12px;

    transition:.3s;
}

.field input::placeholder{
    color:#666;
}

.field input:focus,
.field select:focus{

    border-color:#888;

    box-shadow:
        0 0 18px
        rgba(255,255,255,.06);
}

.field select{

    cursor:pointer;

    appearance:none;

    -webkit-appearance:none;

    padding-left:38px;

    background-image:
        linear-gradient(
            45deg,
            transparent 50%,
            #888 50%
        ),
        linear-gradient(
            135deg,
            #888 50%,
            transparent 50%
        );

    background-position:
        calc(100% - 18px) 19px,
        calc(100% - 12px) 19px;

    background-size:
        6px 6px,
        6px 6px;

    background-repeat:no-repeat;
}

.field select option{
    background:#101010;
    color:#fff;
}


/* =========================
   BUTTON
========================= */

.mainButton{

    width:100%;

    height:46px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #aaa
        );

    color:#000;

    font-family:inherit;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    margin-top:3px;

    transition:.25s;
}

.mainButton:active{
    transform:scale(.97);
}

.mainButton:disabled{
    opacity:.65;
    cursor:not-allowed;
}


/* =========================
   SWITCH
========================= */

.switch{
    text-align:center;

    margin-top:15px;

    color:#666;

    font-size:11px;
}

.switch button{

    border:0;
    background:none;

    color:#ddd;

    font-family:inherit;

    font-size:11px;

    cursor:pointer;

    text-decoration:underline;
}


/* =========================
   SUCCESS
========================= */

.success{

    position:fixed;

    left:50%;
    top:8%;

    transform:
        translateX(-50%)
        translateY(-20px);

    opacity:0;

    color:#ddd;

    font-size:16px;

    font-weight:600;

    transition:.5s;

    z-index:200;

    white-space:nowrap;
}

.success.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .logo3D{
        transform:scale(.78);
        margin-top:-45px;
    }

    .welcome h1{
        font-size:25px;
    }

    .welcome h1 span{
        font-size:27px;
    }

    .question{
        font-size:21px;
    }

    .panel{
        width:86vw;
        padding:23px 16px;
    }
}

@media(max-width:380px){

    .question{
        font-size:19px;
    }

    .answer{
        min-width:82px;
        font-size:11px;
    }
}

@media(max-height:650px){

    .panel{
        max-height:92vh;
    }

    .field input,
    .field select{
        height:42px;
    }

    .mainButton{
        height:43px;
    }
}

</style>
</head>

<body>


<!-- =========================
     INTRO
========================= -->

<section id="intro">

    <div class="introContent">

        <div class="logo3D">

            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>

            <div class="core"></div>

        </div>

        <div class="welcome">

            <h1>

                مرحباً بكم

                <span>
                    𝑨𝒍𝑲𝒉𝒘𝒂𝒓𝒊𝒛𝒎𝒊
                </span>

            </h1>

            <div class="line"></div>

            <small>
                LEARN • CREATE • INNOVATE
            </small>

        </div>

    </div>

</section>


<!-- =========================
     MAIN
========================= -->

<section id="main">


    <div
        class="questionBox"
        id="questionBox">

        <div class="questionTitle">
            الاختبار الأول
        </div>

        <div class="question">
            هل أنت مستعد للمعركة يا صغنون؟ ⚔️
        </div>

        <div class="answers">

            <button
                class="answer"
                id="yes">

                إيواا 🔥

            </button>

            <button
                class="answer"
                id="maybe">

                مش متأكد 🤔

            </button>

            <button
                class="answer"
                id="afraid">

                خايف 😨

            </button>

        </div>

    </div>


    <div id="emojiLayer"></div>

    <div id="flash"></div>

    <div
        class="explosionRing"
        id="explosionRing">
    </div>


    <!-- =========================
         LOGIN
    ========================= -->

    <div
        class="panel"
        id="login">

        <div class="loginLogo">
            &lt; 𝑨𝑳𝑲𝑯𝑾𝑨𝑹𝑰𝒁𝑴𝑰 /&gt;
        </div>

        <h2>
            تسجيل الدخول
        </h2>

        <div class="panelSub">
            أهلاً بك في 𝑨𝒍𝒌𝒉𝒘𝒂𝒓𝒊𝒛𝒎𝒊
        </div>

        <form id="loginForm">

            <div class="field">

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="اسم المستخدم"
                    autocomplete="username"
                    required>

            </div>

            <div class="field">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="كلمة المرور"
                    autocomplete="current-password"
                    required>

            </div>

            <button
                class="mainButton"
                type="submit">

                دخول

            </button>

        </form>

        <div class="switch">

            ليس لديك حساب؟

            <button
                type="button"
                id="openRegister">

                إنشاء حساب

            </button>

        </div>

    </div>


    <!-- =========================
         REGISTER
    ========================= -->

    <div
        class="panel"
        id="register">

        <div class="loginLogo">
            &lt; NEW ACCOUNT /&gt;
        </div>

        <h2>
            إنشاء حساب
        </h2>

        <div class="panelSub">
            أنشئ حسابك في 𝑨𝒍𝒌𝒉𝒘𝒂𝒓𝒊𝒛𝒎𝒊
        </div>

        <form id="registerForm">

            <div class="field">

                <input
                    type="text"
                    id="fullName"
                    placeholder="الاسم بالكامل"
                    autocomplete="name"
                    required>

            </div>

            <div class="field">

                <input
                    type="email"
                    id="email"
                    placeholder="البريد الإلكتروني"
                    autocomplete="email"
                    required>

            </div>

            <div class="field">

                <input
                    type="tel"
                    id="phone"
                    placeholder="رقم الهاتف"
                    inputmode="tel"
                    autocomplete="tel"
                    required>

            </div>

            <div class="field">

                <input
                    type="tel"
                    id="parentPhone"
                    placeholder="رقم ولي الأمر"
                    inputmode="tel"
                    required>

            </div>

            <div class="field">

                <select
                    id="studyStage"
                    required>

                    <option value="" disabled selected>
                        اختر المرحلة الدراسية
                    </option>

                    <option value="أولى إعدادي">
                        أولى إعدادي
                    </option>

                    <option value="ثانية إعدادي">
                        ثانية إعدادي
                    </option>

                    <option value="ثالثة إعدادي">
                        ثالثة إعدادي
                    </option>

                    <option value="أولى ثانوي">
                        أولى ثانوي
                    </option>

                    <option value="ثانية ثانوي">
                        ثانية ثانوي
                    </option>

                    <option value="ثالثة ثانوي">
                        ثالثة ثانوي
                    </option>

                </select>

            </div>

            <div class="field">

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="كلمة المرور"
                    autocomplete="new-password"
                    required>

            </div>

            <div class="field">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="تأكيد كلمة المرور"
                    autocomplete="new-password"
                    required>

            </div>

            <button
                class="mainButton"
                type="submit">

                إنشاء الحساب

            </button>

        </form>

        <div class="switch">

            لديك حساب بالفعل؟

            <button
                type="button"
                id="backLogin">

                تسجيل الدخول

            </button>

        </div>

    </div>

</section>


<div
    class="success"
    id="success">

    ✨ أهلاً بك في 𝑨𝒍𝒌𝒉𝒘𝒂𝒓𝒊𝒛𝒎𝒊 ✨

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const intro =
    document.getElementById("intro");

const main =
    document.getElementById("main");

const questionBox =
    document.getElementById("questionBox");

const yes =
    document.getElementById("yes");

const maybe =
    document.getElementById("maybe");

const afraid =
    document.getElementById("afraid");

const emojiLayer =
    document.getElementById("emojiLayer");

const flash =
    document.getElementById("flash");

const explosionRing =
    document.getElementById("explosionRing");

const login =
    document.getElementById("login");

const register =
    document.getElementById("register");

/* =========================
   PARTICLES
========================= */

function createParticles(){

    for(let i=0;i<55;i++){

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        const angle =
            Math.random()
            * Math.PI
            * 2;

        const distance =
            70 +
            Math.random()*300;

        const x =
            Math.cos(angle)
            * distance;

        const y =
            Math.sin(angle)
            * distance;

        particle.style.setProperty(
            "--px",
            `calc(50% + ${x}px)`
        );

        particle.style.setProperty(
            "--py",
            `calc(50% + ${y}px)`
        );

        particle.style.animationDelay =
            Math.random()*.18 + "s";

        emojiLayer.appendChild(
            particle
        );

        setTimeout(() => {
            particle.remove();
        },1300);

    }
}


/* =========================
   EMOJI EXPLOSION
========================= */

function createEmojiExplosion(){

    const emojis = [
        "⚔️","🔥","💻","⚙️","📐",
        "📏","🧠","🧮","🔧","🔬",
        "💡","⌨️","🚀","🎯","📚",
        "🏆","✨","💥","🤖","🧩"
    ];

    for(let i=0;i<50;i++){

        const item =
            document.createElement("div");

        item.className =
            "boomEmoji";

        item.textContent =
            emojis[
                Math.floor(
                    Math.random()
                    * emojis.length
                )
            ];

        const angle =
            Math.random()
            * Math.PI
            * 2;

        const distance =
            120 +
            Math.random()*360;

        const x =
            Math.cos(angle)
            * distance;

        const y =
            Math.sin(angle)
            * distance;

        item.style.setProperty(
            "--x",
            `calc(50% + ${x}px)`
        );

        item.style.setProperty(
            "--y",
            `calc(50% + ${y}px)`
        );

        item.style.setProperty(
            "--r",
            `${Math.random()*1100-550}deg`
        );

        item.style.animationDelay =
            Math.random()*.35 + "s";

        emojiLayer.appendChild(item);

        setTimeout(() => {
            item.remove();
        },2400);

    }
}

/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    (e) => {

        e.preventDefault();

        const username =
            document
            .getElementById("loginUsername")
            .value
            .trim();

        const password =
            document
            .getElementById("loginPassword")
            .value
            .trim();

        if(!username || !password){

            alert(
                "من فضلك اكتب اسم المستخدم وكلمة المرور"
            );

            return;
        }

        const button =
            loginForm.querySelector(".mainButton");

        button.disabled = true;
        button.textContent = "جاري الدخول...";


        /*
         * تسجيل الدخول التجريبي
         * يتم حفظ اسم المستخدم ثم الانتقال
         * إلى home.html
         */

        const oldUser =
            localStorage.getItem(
                "alkhwarizmi_user"
            );

        let userData = {
            name: username,
            studyStage: "لم يتم تحديدها",
            progress: 0
        };

        if(oldUser){

            try{

                const saved =
                    JSON.parse(oldUser);

                userData = {
                    ...saved,
                    name: username
                };

            }catch(error){

                console.log(
                    "تعذر قراءة بيانات الحساب"
                );

            }

        }

        setTimeout(() => {

            localStorage.setItem(
                "alkhwarizmi_user",
                JSON.stringify(userData)
            );

            button.textContent =
                "تم الدخول ✓";

            showSuccess(
                "✨ أهلاً بك " +
                username +
                " ✨"
            );

            /*
             * التحويل إلى الصفحة الرئيسية
             */

            setTimeout(() => {

                window.location.href =
                    "home.html";

            },700);

        },1000);

    }
);


/* =========================
   REGISTER
========================= */

registerForm.addEventListener(
    "submit",
    (e) => {

        e.preventDefault();

        const name =
            document
            .getElementById("fullName")
            .value
            .trim();

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const phone =
            document
            .getElementById("phone")
            .value
            .trim();

        const parentPhone =
            document
            .getElementById("parentPhone")
            .value
            .trim();

        const studyStage =
            document
            .getElementById("studyStage")
            .value;

        const password =
            document
            .getElementById("registerPassword")
            .value;

        const confirm =
            document
            .getElementById("confirmPassword")
            .value;


        if(
            !name ||
            !email ||
            !phone ||
            !parentPhone ||
            !studyStage ||
            !password ||
            !confirm
        ){

            alert(
                "من فضلك أكمل جميع البيانات واختر المرحلة الدراسية"
            );

            return;
        }


        if(password !== confirm){

            alert(
                "كلمتا المرور غير متطابقتين"
            );

            return;
        }


        if(password.length < 6){

            alert(
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
            );

            return;
        }


        const button =
            registerForm.querySelector(
                ".mainButton"
            );

        button.disabled = true;

        button.textContent =
            "جاري إنشاء الحساب...";


        /*
         * حفظ بيانات المستخدم مؤقتاً
         * باستخدام localStorage
         */

        const userData = {

            name: name,

            email: email,

            phone: phone,

            parentPhone: parentPhone,

            studyStage: studyStage,

            progress: 0

        };


        localStorage.setItem(
            "alkhwarizmi_user",
            JSON.stringify(userData)
        );


        setTimeout(() => {

            button.textContent =
                "تم إنشاء الحساب ✓";

            showSuccess(
                "🎉 تم إنشاء حسابك بنجاح"
            );


            /*
             * الانتقال إلى home.html
             */

            setTimeout(() => {

                window.location.href =
                    "home.html";

            },900);

        },1200);

    }
);
